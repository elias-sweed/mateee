<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Estadístico Neón Interactivo</title>
    <style>
        :root {
            --bg-color: #0a0c14;
            --card-bg: #121526;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff007f;
            --neon-yellow: #ffee00;
            --neon-green: #00ff66;
            --neon-red: #ff3333;
            --text-color: #ffffff;
            --text-dim: #9095b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            position: relative;
        }

        h1 {
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            margin-bottom: 20px;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid var(--neon-magenta);
        }

        .status-item {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-item span {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .welcome-box {
            text-align: center;
            padding: 20px 0;
        }

        .welcome-box p {
            margin-bottom: 25px;
            font-size: 1.1rem;
            color: var(--text-dim);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--neon-cyan);
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover:not(:disabled) {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .btn-easy { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-easy:hover:not(:disabled) { background: var(--neon-green); color: var(--bg-color); }

        .btn-medium { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .btn-medium:hover:not(:disabled) { background: var(--neon-yellow); color: var(--bg-color); }

        .btn-hard { border-color: var(--neon-magenta); color: var(--neon-magenta); }
        .btn-hard:hover:not(:disabled) { background: var(--neon-magenta); color: var(--bg-color); }

        /* Preguntas y Contenido Visual */
        .question-box {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 18px;
            border-radius: 8px;
            border-left: 4px solid var(--neon-cyan);
        }

        .question-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .chart-container {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        /* OPCIONES DE SELECCIÓN */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 243, 255, 0.3);
            color: var(--text-color);
            padding: 14px 18px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* ESTADOS TRAS SELECCIONAR (BLOQUEO Y COLORES) */
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-btn.correct-choice {
            border-color: var(--neon-green) !important;
            background: rgba(0, 255, 102, 0.25) !important;
            color: #fff !important;
            box-shadow: 0 0 15px var(--neon-green) !important;
            font-weight: bold;
        }

        .option-btn.incorrect-choice {
            border-color: var(--neon-red) !important;
            background: rgba(255, 51, 51, 0.25) !important;
            color: #fff !important;
            box-shadow: 0 0 15px var(--neon-red) !important;
        }

        /* ENTRADA DE TEXTO (ESCRIBIR) */
        .input-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .input-text {
            flex: 1;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            color: var(--neon-yellow);
            font-size: 1.1rem;
            outline: none;
        }

        .input-text:disabled {
            opacity: 0.7;
            border-color: var(--text-dim);
        }

        .feedback-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .feedback-msg.correct {
            display: block;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .feedback-msg.incorrect {
            display: block;
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid var(--neon-red);
            color: #ff8888;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* GRÁFICO DE BARRAS NEÓN EN CSS */
        .bar-chart-visual {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 180px;
            padding-top: 25px;
            border-bottom: 2px solid var(--neon-cyan);
            border-left: 2px solid var(--neon-cyan);
            gap: 10px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(to top, var(--neon-magenta), var(--neon-cyan));
            border-radius: 4px 4px 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #000;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .bar-tag {
            position: absolute;
            bottom: -25px;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            text-align: center;
            width: 100%;
        }

        /* TABLA NEÓN */
        .neon-table {
            width: 100%;
            border-collapse: collapse;
        }

        .neon-table th, .neon-table td {
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 8px 12px;
            text-align: left;
        }

        .neon-table th {
            background: rgba(0, 243, 255, 0.2);
            color: var(--neon-cyan);
        }

        .final-score {
            font-size: 3.5rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px var(--neon-yellow);
            margin: 15px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Desafío Estadístico Neón</h1>

    <div class="header-status">
        <div class="status-item">Nivel: <span id="current-level">--</span></div>
        <div class="status-item">Pregunta: <span id="q-progress">0/0</span></div>
        <div class="status-item">Puntos: <span id="score">0</span></div>
    </div>

    <!-- PANTALLA INICIO -->
    <div id="screen-welcome" class="screen active">
        <div class="welcome-box">
            <h2>Práctica Interactiva - Matemática 4.° Grado</h2>
            <p>Resuelve las preguntas basadas en las encuestas y gráficos del aula. Selecciona tu nivel:</p>
            <div class="btn-grid">
                <button class="btn btn-easy" onclick="startGame('facil')">Fácil<br><small>Lectura directa de tablas</small></button>
                <button class="btn btn-medium" onclick="startGame('medio')">Medio<br><small>Gráficos y Porcentajes</small></button>
                <button class="btn btn-hard" onclick="startGame('dificil')">Difícil<br><small>Problemas Operativos</small></button>
            </div>
        </div>
    </div>

    <!-- PANTALLA QUIZ -->
    <div id="screen-quiz" class="screen">
        <div class="question-box">
            <div class="question-title" id="question-text">Cargando pregunta...</div>
            <div id="visual-content"></div>
        </div>

        <div id="interaction-area"></div>

        <div id="feedback" class="feedback-msg"></div>

        <div class="action-bar">
            <button id="btn-next" class="btn" onclick="nextQuestion()" style="display: none; border-color: var(--neon-green); color: var(--neon-green);">Siguiente Pregunta ➔</button>
        </div>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="screen-results" class="screen">
        <div class="welcome-box">
            <h2>¡Nivel Completado!</h2>
            <p>Puntaje obtenido:</p>
            <div class="final-score" id="final-score-val">0</div>
            <button class="btn" onclick="showWelcome()">Elegir otro nivel</button>
        </div>
    </div>
</div>

<script>
    // BASE DE DATOS DE PREGUNTAS (TODAS UNICAS Y DIFERENTES)
    const questionsDatabase = {
        facil: [
            {
                type: 'select',
                text: '1. Según la tabla de la encuesta, ¿cuántos estudiantes eligieron "Ruido en las aulas y corredores"?',
                options: ['12 estudiantes', '16 estudiantes', '14 estudiantes', '9 estudiantes'],
                correct: 2,
                visual: () => `
                    <div class="chart-container">
                        <table class="neon-table">
                            <tr><th>Situación preocupante</th><th>Frecuencia</th></tr>
                            <tr><td>a) Bullying o maltrato</td><td>12</td></tr>
                            <tr><td>b) Suciedad en baños/patios</td><td>16</td></tr>
                            <tr><td>c) Cuidado de materiales</td><td>9</td></tr>
                            <tr style="color:var(--neon-green)"><td>d) Ruido en aulas y corredores</td><td>14</td></tr>
                        </table>
                    </div>`
            },
            {
                type: 'select',
                text: '2. En el gráfico de barras, ¿cuál es la barra con la altura MÁS BAJA (menos votos)?',
                options: ['Falta de áreas verdes (e)', 'Otro (f)', 'Falta de cuidado de materiales (c)', 'Bullying (a)'],
                correct: 1,
                visual: () => `
                    <div class="chart-container">
                        <div class="bar-chart-visual">
                            <div class="bar" style="height: 66%;">12<span class="bar-tag">a</span></div>
                            <div class="bar" style="height: 88%;">16<span class="bar-tag">b</span></div>
                            <div class="bar" style="height: 50%;">9<span class="bar-tag">c</span></div>
                            <div class="bar" style="height: 77%;">14<span class="bar-tag">d</span></div>
                            <div class="bar" style="height: 27%;">5<span class="bar-tag">e</span></div>
                            <div class="bar" style="height: 22%; border: 2px solid var(--neon-yellow);">4<span class="bar-tag">f</span></div>
                        </div>
                        <p style="margin-top:30px; font-size:0.8rem; text-align:center; color:var(--text-dim)">Eje X: Opciones a, b, c, d, e, f</p>
                    </div>`
            },
            {
                type: 'input',
                text: '3. Escribe el número total de estudiantes que respondieron la encuesta en la sección "Tabla de Resultados":',
                correctAnswer: '40',
                visual: () => `<div class="chart-container"><p style="color:var(--neon-cyan)">Pista: Suma total de las frecuencias del grupo de 4.º grado.</p></div>`
            }
        ],
        medio: [
            {
                type: 'select',
                text: '1. Observa el gráfico circular. ¿Qué porcentaje corresponde a la "Suciedad en los baños y patios" (Opción B)?',
                options: ['30%', '25%', '15%', '12,5%'],
                correct: 1,
                visual: () => `
                    <div class="chart-container" style="text-align:center">
                        <p style="color:var(--neon-yellow); margin-bottom:10px;">Distribución porcentual:</p>
                        <p>a) Bullying: 30% | <b style="color:var(--neon-green)">b) Suciedad: 25%</b> | c) Materiales: 22,5%</p>
                        <p>d) Ruido: 15% | e) Áreas verdes: 12,5% | f) Otro: 10%</p>
                    </div>`
            },
            {
                type: 'input',
                text: '2. Escribe la diferencia exacta: ¿Cuántos alumnos más prefieren resolver "Bullying" (12) que "Falta de áreas verdes" (5)?',
                correctAnswer: '7',
                visual: () => `<div class="chart-container"><p style="color:var(--neon-magenta)">Resta la frecuencia de (a) menos la frecuencia de (e): 12 - 5 = ?</p></div>`
            },
            {
                type: 'select',
                text: '3. En estadística, la "Moda" es el valor que tiene la mayor frecuencia. ¿Cuál es la Moda de este conjunto de datos?',
                options: ['Ruido en el aula (14)', 'Suciedad en baños y patios (16)', 'Bullying o maltrato (12)', 'Falta de materiales (9)'],
                correct: 1
            }
        ],
        dificil: [
            {
                type: 'input',
                text: '1. Se comprarán 1 248 plantitas y 2 375 bolsas de tierra para los patios. ¿Cuántos materiales se comprarán en total?',
                correctAnswer: '3623',
                visual: () => `<div class="chart-container"><p style="color:var(--neon-cyan)">Resuelve la adición: 1248 + 2375</p></div>`
            },
            {
                type: 'input',
                text: '2. De los 1 356 estudiantes del colegio, 782 participaron en la encuesta. ¿Cuántos NO participaron?',
                correctAnswer: '574',
                visual: () => `<div class="chart-container"><p style="color:var(--neon-magenta)">Resuelve la sustracción: 1356 - 782</p></div>`
            },
            {
                type: 'input',
                text: '3. Si la escuela desea comprar 3 480 libros a S/ 27 cada uno, ¿cuánto dinero en soles necesitará en total?',
                correctAnswer: '93960',
                visual: () => `<div class="chart-container"><p style="color:var(--neon-yellow)">Resuelve la multiplicación: 3480 × 27</p></div>`
            }
        ]
    };

    let currentQuestions = [];
    let qIndex = 0;
    let score = 0;
    let answered = false;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showWelcome() {
        showScreen('screen-welcome');
        document.getElementById('current-level').innerText = '--';
        document.getElementById('q-progress').innerText = '0/0';
        document.getElementById('score').innerText = '0';
    }

    function startGame(level) {
        currentQuestions = [...questionsDatabase[level]];
        qIndex = 0;
        score = 0;
        document.getElementById('current-level').innerText = level.toUpperCase();
        document.getElementById('score').innerText = score;
        showScreen('screen-quiz');
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = currentQuestions[qIndex];
        
        document.getElementById('q-progress').innerText = `${qIndex + 1}/${currentQuestions.length}`;
        document.getElementById('question-text').innerText = q.text;
        document.getElementById('btn-next').style.display = 'none';
        
        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback-msg';
        feedback.style.display = 'none';

        // Render visual
        const visualArea = document.getElementById('visual-content');
        visualArea.innerHTML = q.visual ? q.visual() : '';

        // Render interacción
        const container = document.getElementById('interaction-area');
        container.innerHTML = '';

        if (q.type === 'select') {
            const grid = document.createElement('div');
            grid.className = 'options-grid';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelectAnswer(idx);
                grid.appendChild(btn);
            });
            container.appendChild(grid);
        } else if (q.type === 'input') {
            const box = document.createElement('div');
            box.className = 'input-box';

            const input = document.createElement('input');
            input.type = 'text';
            input.id = 'user-input';
            input.className = 'input-text';
            input.placeholder = 'Escribe tu número aquí...';

            const sendBtn = document.createElement('button');
            sendBtn.className = 'btn';
            sendBtn.innerText = 'Enviar';
            sendBtn.onclick = () => handleInputAnswer();

            box.appendChild(input);
            box.appendChild(sendBtn);
            container.appendChild(box);
        }
    }

    // MANEJO DE SELECCIÓNÚNICA E INMEDIATA
    function handleSelectAnswer(chosenIdx) {
        if (answered) return; // Bloqueo para impedir volver a responder
        answered = true;

        const q = currentQuestions[qIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');

        // Deshabilitar todos los botones para que no se pueda cambiar
        buttons.forEach(btn => btn.disabled = true);

        if (chosenIdx === q.correct) {
            score += 100;
            document.getElementById('score').innerText = score;
            buttons[chosenIdx].classList.add('correct-choice');
            feedback.innerText = '¡CORRECTO! Excelente elección.';
            feedback.className = 'feedback-msg correct';
        } else {
            buttons[chosenIdx].classList.add('incorrect-choice');
            buttons[q.correct].classList.add('correct-choice'); // Mostrar cuál era la correcta
            feedback.innerText = `INCORRECTO. La respuesta correcta era: "${q.options[q.correct]}"`;
            feedback.className = 'feedback-msg incorrect';
        }

        document.getElementById('btn-next').style.display = 'block';
    }

    // MANEJO DE ENTRADA DE TEXTO
    function handleInputAnswer() {
        if (answered) return;
        
        const inputEl = document.getElementById('user-input');
        const val = inputEl.value.trim().replace(/[\s,.]/g, '');
        
        if (!val) {
            alert('Por favor escribe tu respuesta.');
            return;
        }

        answered = true;
        inputEl.disabled = true;

        const q = currentQuestions[qIndex];
        const feedback = document.getElementById('feedback');

        if (val.toLowerCase() === q.correctAnswer.toLowerCase()) {
            score += 100;
            document.getElementById('score').innerText = score;
            inputEl.style.borderColor = 'var(--neon-green)';
            feedback.innerText = '¡CORRECTO! El cálculo es exacto.';
            feedback.className = 'feedback-msg correct';
        } else {
            inputEl.style.borderColor = 'var(--neon-red)';
            feedback.innerText = `INCORRECTO. La respuesta correcta era: ${q.correctAnswer}`;
            feedback.className = 'feedback-msg incorrect';
        }

        document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
        qIndex++;
        if (qIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showScreen('screen-results');
            document.getElementById('final-score-val').innerText = score;
        }
    }
</script>

</body>
</html>
